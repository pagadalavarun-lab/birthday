<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Secret Message</title>

<style>
body {
    background: black;
    color: #00ffcc;
    font-family: monospace;
    text-align: center;
    padding-top: 100px;
}

#code {
    font-size: 18px;
    white-space: pre-line;
}

button {
    margin-top: 30px;
    padding: 10px 20px;
    background: #00ffcc;
    border: none;
    cursor: pointer;
    font-size: 16px;
}

/* 💝 Card */
#card {
    display: none;
    margin-top: 50px;
    background: white;
    color: black;
    padding: 20px;
    width: 300px;
    margin-left: auto;
    margin-right: auto;
    border-radius: 15px;
    box-shadow: 0px 0px 20px pink;
}

#card img {
    width: 100%;
    border-radius: 10px;
}
</style>
</head>

<body>

<div id="code"></div>

<!-- ✅ First Button -->
<button id="btn1" onclick="showSecond()">Touch me </button>

<!-- ✅ Second Button -->
<button id="btn2" onclick="openCard()" style="display:none;">
    Touch me one more time 🎁
</button>

<div id="card">
    <h2>🎉 Happy Birthday Neha 🎉</h2>
    <img src="neha.jpg" alt="Neha Photo">
    <p>You are the best part of my code ❤️</p>
</div>

<audio id="music" preload="none">
  <source src="https://varun.s3.us-east-1.amazonaws.com/WhatsApp%20Audio%202026-04-28%20at%207.45.46%20PM.mpeg" type="audio/mpeg">
</audio>

<script>
let message = `
Initializing feelings.exe...

    IT's a special day for a girl whom i admire
               "Happy Birthday Nihu ❤️"
                   "from your buddy"
}

Loading surprise...
`;

let i = 0;

function typeEffect() {
    if (i < message.length) {
        document.getElementById("code").innerHTML += message.charAt(i);
        i++;
        setTimeout(typeEffect, 40);
    }
}

typeEffect();

/* 👉 Step 1 */
function showSecond() {
    document.getElementById("btn1").style.display = "none";

    document.getElementById("code").innerHTML += 
    "\n\nAccess granted...\nClick once more 💖";

    setTimeout(() => {
        document.getElementById("btn2").style.display = "inline-block";
    }, 800);
}

/* 👉 Step 2 */
function openCard() {
    document.getElementById("card").style.display = "block";
    document.getElementById("music").play();
}
</script>

</body>
</html>
